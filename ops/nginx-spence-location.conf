# Example: route Spence's PHP to its dedicated pool. Place inside the server block,
# after any rules that deny sensitive paths and before a generic PHP location.
# DEPLOYMENT.md has a complete location block for serving the code itself.
location ~ ^/spence/.*\.php$ {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/spence-fpm.sock;
}
