; Example hardened PHP-FPM pool for Spence, following the layout in DEPLOYMENT.md.
; Create the spence user and the directories below first; adjust paths to yours.
[spence]
user = spence
group = spence

listen = /run/php/spence-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 250
request_terminate_timeout = 130s

catch_workers_output = yes
decorate_workers_output = yes
clear_env = yes
security.limit_extensions = .php
apparmor_hat = spence

env[SPENCE_DB_PATH] = /var/lib/spence/spence.db
env[SPENCE_UPLOAD_DIR] = /var/lib/spence/uploads
env[SPENCE_CREDENTIAL_FILE] = /etc/spence/access-key
env[NANOGPT_CREDENTIAL_FILE] = /etc/spence/nanogpt-key
env[SPENCE_TENANTS_DIR] = /etc/spence/tenants
env[SPENCE_TENANT_DATA_DIR] = /var/lib/spence/tenants
env[SPENCE_AI_DEBUG] = 0
env[FORGE_DB_PATH] = /var/lib/forge/exports/spence-v1.db
env[FORGE_EXPORT_MAX_AGE_SECONDS] = 300

; Optional shopping-list handoff; leave unset to turn it off.
;env[SPENCE_INGREDIENTS_PATH] = /srv/ingredients/shopping_list.json

php_admin_flag[file_uploads] = on
php_admin_value[upload_tmp_dir] = /var/lib/spence/tmp
php_admin_value[session.save_path] = /var/lib/spence/sessions
php_admin_flag[session.use_strict_mode] = on
php_admin_flag[session.cookie_secure] = on
php_admin_flag[session.cookie_httponly] = on
php_admin_value[session.cookie_samesite] = Strict

; CVE-2026-109619 hardening: upload progress is unused; keep it off after patching.
php_admin_flag[session.upload_progress.enabled] = off
